services:
  inference:
    image: vllm/vllm-openai:gemma4-0505-cu130@sha256:231bb8892358bda708804addd3d07b50cc05d0d77b2a527c8f5b36780c54a57f
    # Prefix caching stated, not left to the engine default: a repeated system prompt or
    # conversation is not prefilled again. On for this model on every vLLM version;
    # stated so a newer engine cannot change it unseen.
    entrypoint: [bash, -c]
    command:
      - |-
        sed -i 's/quant_config=vllm_config\.quant_config,/quant_config=None,/' /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/gemma4_mtp.py && echo "PATCHED: gemma4_mtp.py quant_config=None for drafter"
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name gemma-4-31b-it \
          --host 0.0.0.0 --port 8080 \
          --enable-prefix-caching \
          --trust-remote-code \
          --gpu-memory-utilization 0.57 \
          --max-num-seqs 128 \
          --max-num-batched-tokens 4096 \
          --max-model-len 131072 --kv-cache-dtype fp8_e4m3 \
          --quantization modelopt \
          --tensor-parallel-size 1 \
          --language-model-only \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --reasoning-parser gemma4 \
          --speculative-config '{"model": "/drafter", "num_speculative_tokens": 4}'

    volumes:
      - model:/models/model:ro
      - draft:/models/draft:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main
  draft:
    x-ai-deploy:
      weights: draft
