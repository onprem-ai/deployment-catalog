services:
  inference:
    image: vllm/vllm-openai:cu130-nightly@sha256:3dbe092ec5b2cef63b6104d33fa75d6ce53a7870962529ada69f78bbbc38e776
    # Prefix caching stated, not left to the engine default: a repeated system prompt or
    # conversation is not prefilled again. On for this model on every vLLM version;
    # stated so a newer engine cannot change it unseen.
    entrypoint: [bash, -c]
    command:
      - |-
        export VLLM_WORKER_MULTIPROC_METHOD=spawn
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name gemma-4-31b-it-turbo \
          --host 0.0.0.0 --port 8080 \
          --enable-prefix-caching \
          --trust-remote-code \
          --gpu-memory-utilization 0.33 \
          --max-num-seqs 128 \
          --max-model-len 131072 --kv-cache-dtype fp8_e4m3 \
          --quantization modelopt \
          --tensor-parallel-size 1 \
          --max-num-batched-tokens 4096 \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --reasoning-parser gemma4 \
          --enforce-eager \
          --speculative-config '{"method": "ngram", "num_speculative_tokens": 5, "prompt_lookup_max": 4}'

    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main