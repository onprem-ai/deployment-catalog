$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: GPT OSS 120B
  logo: openai.svg
  short_description: >-
    OpenAI's open-source 120B parameter model. Excellent reasoning and coding capabilities with
    GPT-4 class performance. Full precision for NVIDIA GPUs with vLLM.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 98784247808
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: gpt-oss-120b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2025-08-05'
  parameter_count: 120000000000
  active_parameter_count: 5000000000
  weights_disk_size_bytes: 64424509440
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://huggingface.co/openai/gpt-oss-120b/resolve/b5c939de8f754692c1647ca79fbf85e8c1e70f8a/LICENSE
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: fp4
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 131072
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: openai--gpt-oss-120b--model
      files:
      - LICENSE
      - USAGE_POLICY
      - config.json
      - generation_config.json
      - model-00000-of-00014.safetensors
      - model-00001-of-00014.safetensors
      - model-00002-of-00014.safetensors
      - model-00003-of-00014.safetensors
      - model-00004-of-00014.safetensors
      - model-00005-of-00014.safetensors
      - model-00006-of-00014.safetensors
      - model-00007-of-00014.safetensors
      - model-00008-of-00014.safetensors
      - model-00009-of-00014.safetensors
      - model-00010-of-00014.safetensors
      - model-00011-of-00014.safetensors
      - model-00012-of-00014.safetensors
      - model-00013-of-00014.safetensors
      - model-00014-of-00014.safetensors
      - model.safetensors.index.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
