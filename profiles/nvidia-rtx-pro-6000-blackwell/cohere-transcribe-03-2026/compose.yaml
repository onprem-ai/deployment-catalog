services:
  inference:
    image: vllm/vllm-openai:v0.19.0@sha256:d9a5c1c1614c959fde8d2a4d68449db184572528a6055afdd0caf1e66fb51504
    entrypoint: [bash, -c]
    command:
      - |-
        pip install "vllm[audio]" librosa --quiet && \
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name cohere-transcribe \
          --host 0.0.0.0 --port 8080 \
          --trust-remote-code \
          --gpu-memory-utilization 0.07 \
          --max-num-seqs 128 \
          --max-num-batched-tokens 4096

    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '4'
          memory: 8G

volumes:
  model:
    x-ai-deploy:
      weights: main