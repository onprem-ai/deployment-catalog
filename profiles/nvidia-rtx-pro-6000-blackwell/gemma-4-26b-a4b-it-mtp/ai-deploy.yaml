$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: Gemma 4 26B-A4B IT
  subtitle: FP8 · MTP
  logo: google.svg
  short_description: >-
    DEPRECATED: MTP is 50% slower than baseline on Blackwell (102 vs 207 tok/s). Use
    gemma-4-26b-a4b-it instead. Google's Gemma 4 26B MoE with Multi-Token Prediction speculative
    decoding.
  maturity: deprecated
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 75161927680
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: gemma-4-26b-a4b-it
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-04-22'
  parameter_count: 26000000000
  active_parameter_count: 3800000000
  weights_disk_size_bytes: 30064771072
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://ai.google.dev/gemma/apache_2.md.txt
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: fp8-dynamic
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: RedHatAI--gemma-4-26B-A4B-it-FP8-Dynamic--model
    draft:
      provider: onprem-ai
      repository: google--gemma-4-26B-A4B-it-assistant--model
