services:
  inference:
    image: onpremai/llama-cpp-blackwell:latest@sha256:69143b44cc2235a34821fb9a38b6a1ff070a29819f44b9ad909a0f7e44567fc7
    command:
      - -m
      - /models/model/Devstral-2-123B-Instruct-2512-Q4_K_M-00001-of-00002.gguf
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - -ngl
      - '999'
      - --flash-attn
      - 'on'
      - --no-mmap
      - -c
      - '65536'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - -b
      - '4096'
      - -ub
      - '4096'
      - --jinja
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '4'
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main