$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Ling 3.2 Air
  subtitle: NVFP4 experts (third-party) · MTP · vision · 256K context
  logo: assets/logo.png
  short_description: >-
    inclusionAI's 124B-total / 5.5B-active multimodal hybrid-linear MoE for workflow automation
    and professional documents: text and image input, reasoning, tool calling. primitive-ai's
    NVFP4 build of the routed experts (77.9 GB against the publisher's 129 GB FP8), which its
    maker reports running on one RTX PRO 6000 Blackwell. Only tensors, JSON and the chat
    template come from the third-party repository; the model's Python code comes from
    inclusionAI's own. MTP speculative decoding, 262,144-token context; measured on one GPU
    on 2026-11-27.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    # 96,768 MiB (94.5 GiB) with an 88 GiB engine booking (primitive-ai ran
    # --gpu-memory-utilization 0.92): the measured peak is 96,453 MiB after long prompts,
    # 6 GiB above the engine booking (journal 2026-11-27-first-start-tuning-and-benchmark.md).
    # An idle RTX PRO 6000 Blackwell has 97,251 MiB free.
    memory_bytes_per_device: 101468602368
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 94489280512
  # At the peak, after long prompts (journal 2026-11-27-first-start-tuning-and-benchmark.md).
  measured_gpu_memory_bytes_per_device:
    model_weights: 78275778969
    cuda_graphs: 1299227607
    runtime_overhead: 14594709915
    kv_cache: 6968584437
  measured_kv_cache_tokens_per_replica: 421486

api:
  routing_model_id: ling-3.2-air
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: inclusionAI (Ant Group); NVFP4 build by primitive-ai
  homepage: https://huggingface.co/primitive-ai/Ling-3.2-air-NVFP4
  released_at: '2026-11-23'
  parameter_count: 124000000000
  active_parameter_count: 5500000000
  weights_disk_size_bytes: 77919638485
  license:
    expression: MIT
    name: MIT License
    url: https://huggingface.co/inclusionAI/Ling-3.2-air/blob/ff099487f6f57165e6fa9386ad61fddfafc78b76/README.md
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4-experts-bf16
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    # The third-party NVFP4 build: tensors (.safetensors), JSON and the chat template only.
    # No Python file of this repository is downloaded.
    main:
      provider: huggingface
      repository: primitive-ai/Ling-3.2-air-NVFP4
      revision: a01b9c21680a104ccefcbce5b9e6745c004fb89b
      files:
      - chat_template.jinja
      - config.json
      - experts-layer02.safetensors
      - experts-layer03.safetensors
