$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Qwen3.8 Flash Next
  subtitle: NVIDIA FP4 · 1M context · MTP · 2× GPU
  logo: assets/logo.svg
  short_description: >-
    Qwen's 176B-total, 6B-active multimodal MoE preview of the Qwen4 architecture, in NVIDIA's
    official FP4 checkpoint, across two RTX PRO 6000 Blackwell GPUs. YaRN rope scaling (factor 4) extends
    the trained 262K context to 1,048,576 tokens per request; FP8 KV cache, MTP speculative
    decoding, PLE n-gram table in host memory.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    memory_bytes_per_device: 102005473280
  cpu:
    architecture: amd64
  memory:
    host_bytes: 51539607552

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 97710505984
  measured_gpu_memory_bytes_per_device:
    model_weights: 40523016437
    cuda_graphs: 1932735283
    runtime_overhead: 6405289412
    kv_cache: 51024211476
  measured_kv_cache_tokens_per_replica: 6220472

api:
  routing_model_id: qwen3.8-flash-next
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
    smoke_test:
      request:
        headers: {}
        body:
          messages:
          - role: user
            content: say hello in one word
          max_tokens: 16
          temperature: 0
          stream: false
          chat_template_kwargs:
            enable_thinking: false
      expect:
        status: 200

model:
  released_at: '2026-10-15'
  parameter_count: 176000000000
  active_parameter_count: 6000000000
  weights_disk_size_bytes: 102262281102
  license:
    expression: LicenseRef-NVIDIA-Open-Model-Agreement AND LicenseRef-Qwen-Community-License-1.0
    name: NVIDIA Open Model Agreement; base model under the Qwen Community License 1.0
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-agreement/
    file: licenses/source-1-NVIDIA-Open-Model-Agreement.txt
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4-mixed-precision
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 1048576
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: huggingface
      repository: nvidia/Qwen3.8-Flash-Next-FP4-Local
      revision: b9ce18a6887e18c089fdea8509a33e63429a3300
