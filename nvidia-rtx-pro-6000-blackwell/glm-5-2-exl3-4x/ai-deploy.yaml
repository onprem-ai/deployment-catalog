$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: GLM 5.2
  subtitle: EXL3 3.5bpw · 4× GPU
  logo: assets/logo.svg
  short_description: >-
    GLM-5.2 744B MoE for 4x RTX PRO 6000 Blackwell. Projection-mixed EXL3 routed experts, online
    Trellis K6 dense and shared projections, NVFP4 DS-MLA KV cache, B12X kernels, and MTP3
    speculative decoding. MIT licensed.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 4
    memory_bytes_per_device: 100931731456
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: glm-5-2-exl3-4x
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-06-16'
  parameter_count: 744000000000
  active_parameter_count: 40000000000
  weights_disk_size_bytes: 346818609152
  license:
    expression: MIT
    name: MIT License
    url: https://huggingface.co/brandonmusic/GLM-5.2-EXL3-TR3v4-3.5bpw-MTP78/resolve/9ab9579774cc432df91567a36f6e9e863e0d4c9f/LICENSE
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: exl3-3.5bpw
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 1048576
    reasoning: true
    tool_use: true
