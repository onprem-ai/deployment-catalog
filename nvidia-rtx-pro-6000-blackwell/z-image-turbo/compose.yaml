services:
  inference:
    image: onpremai/z-image-turbo-server:latest@sha256:c70ea5be70a850d2aadcc11c7193f11cc3e5a1d2f49d42baeef33399f31b38a4
    command:
    environment:
      MODEL_DIR: "/models"
    volumes:
      - model:/models/model:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '4'
          memory: 14G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main