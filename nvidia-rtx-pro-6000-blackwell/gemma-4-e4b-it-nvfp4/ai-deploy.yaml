$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Gemma 4 E4B IT
  logo: assets/logo.svg
  short_description: >-
    Google DeepMind's efficient multimodal model with NVIDIA FP4 quantization. 4.5B effective
    parameters, 128K context. Handles text, image, video, and audio. Optimized for edge/on-device
    deployment.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 25769803776
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 23622320128
  measured_gpu_memory_bytes_per_device:
    model_weights: 10544144711
    cuda_graphs: 343597383
    runtime_overhead: 2476149311
    kv_cache: 12133282611
  measured_kv_cache_tokens_per_replica: 123376

api:
  routing_model_id: gemma-4-e4b-it
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-04-01'
  parameter_count: 26000000000
  active_parameter_count: 4500000000
  weights_disk_size_bytes: 10737418240
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://ai.google.dev/gemma/apache_2.md.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: nvfp4
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 131072
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: cosmicproc--gemma-4-E4B-it-NVFP4--model
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - hf_quant_config.json
      - model.safetensors
      - preprocessor_config.json
      - tokenizer.json
      - tokenizer_config.json
