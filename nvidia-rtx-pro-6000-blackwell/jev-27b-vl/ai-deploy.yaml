$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: JEV 27B VL
  subtitle: BF16 · System 1 decisions · vision
  short_description: >-
    AutoTrust's open decision model on the multimodal Qwen3.8-27B. One vLLM engine serves calibrated
    typed decisions over text and images (yes/no, choice, 0-5 score) through the jev-27b-vl-decision
    LoRA module, and generation with reasoning, tool use and image input through the base model. Up
    to 8 requests run at once.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 80530636800
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: jev-27b-vl
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - POST /v1/completions
    # Typed decisions, the OpenAI Decisions API: answered inside the engine's server by
    # the profile's container-files/decisions_middleware.py (see compose.yaml).
    - POST /v1/decisions
    - GET /v1/models
    # The model thinks by default, and a short token cap ends inside its reasoning;
    # thinking off and room for a few words make the check see a real answer.
    smoke_test:
      request:
        headers: {}
        body:
          messages:
          - role: user
            content: say hello in one word
          max_tokens: 16
          temperature: 0
          stream: false
          chat_template_kwargs:
            enable_thinking: false
      expect:
        status: 200
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: AutoTrust AI
  homepage: https://huggingface.co/autotrust
  released_at: '2026-09-30'
  parameter_count: 27781427952
  architecture: dense-hybrid
  weights_disk_size_bytes: 56037541924
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: bf16
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 32768
    reasoning: true
    tool_use: true
    decisions: true
  weights:
    main:
      provider: huggingface
      repository: autotrust/JEV-27B-VL
      revision: fee8c1d19d60216f8e9bcbb348141c0aa87ee2cc
      files:
      - model-00001-of-00018.safetensors
      - model-00002-of-00018.safetensors
      - model-00003-of-00018.safetensors
      - model-00004-of-00018.safetensors
      - model-00005-of-00018.safetensors
      - model-00006-of-00018.safetensors
      - model-00007-of-00018.safetensors
      - model-00008-of-00018.safetensors
      - model-00009-of-00018.safetensors
      - model-00010-of-00018.safetensors
      - model-00011-of-00018.safetensors
      - model-00012-of-00018.safetensors
      - model-00013-of-00018.safetensors
      - model-00014-of-00018.safetensors
      - model-00015-of-00018.safetensors
      - model-00016-of-00018.safetensors
      - model-00017-of-00018.safetensors
      - model-00018-of-00018.safetensors
      - model.safetensors.index.json
      - config.json
      - generation_config.json
      - preprocessor_config.json
      - video_preprocessor_config.json
