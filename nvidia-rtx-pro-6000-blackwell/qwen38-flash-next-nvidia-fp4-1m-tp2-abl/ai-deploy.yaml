$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Qwen3.8 Flash Next Abliterated
  subtitle: NVIDIA FP4 · 1M context · MTP · 2× GPU
  logo: assets/logo.svg
  short_description: >-
    Abliterated (decensored) Qwen3.8 Flash Next: NVIDIA's official FP4 checkpoint with the refusal
    directions removed from the 48 attention output projections (still MXFP8), all else byte-identical.
    176B-total / 6B-active multimodal MoE across two RTX PRO 6000 Blackwell GPUs; YaRN 1,048,576-token context, FP8 KV cache, MTP,
    PLE n-gram table in GPU memory (no host RAM offload). Engine setup of the official card. Uncensored -- use responsibly. EXPERIMENTAL.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    memory_bytes_per_device: 100931731456   # 94 GiB (deployment-catalog #26): a GPU shows 94.97 GiB free; the official card's measured peak is 93.11 GiB
  cpu:
    architecture: amd64
  memory:
    host_bytes: 51539607552

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 97710505984
  measured_gpu_memory_bytes_per_device:
    model_weights: 54932631716
    cuda_graphs: 783831532
    runtime_overhead: 7607964139
    kv_cache: 36646808453
  measured_kv_cache_tokens_per_replica: 4467722

api:
  routing_model_id: qwen3.8-flash-next-abliterated
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
    smoke_test:
      request:
        headers: {}
        body:
          messages:
          - role: user
            content: say hello in one word
          max_tokens: 16
          temperature: 0
          stream: false
          chat_template_kwargs:
            enable_thinking: false
      expect:
        status: 200

model:
  released_at: '2026-11-20'
  parameter_count: 176000000000
  active_parameter_count: 6000000000
  weights_disk_size_bytes: 102259308071
  license:
    expression: LicenseRef-NVIDIA-Open-Model-Agreement AND LicenseRef-Qwen-Community-License-1.0
    name: NVIDIA Open Model Agreement; base model under the Qwen Community License 1.0
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-agreement/
    file: licenses/source-1-NVIDIA-Open-Model-Agreement.txt
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4-mixed-precision
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 1048576
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: onprem-ai--Qwen3.8-Flash-Next-FP4-abliterated-v2
      files:
      - LICENSE
      - LICENSE-Qwen
      - NOTICE
      - abliteration_report.json
      - chat_template.jinja
      - config.json
      - generation_config.json
      - merges.txt
