$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Hy4 flash
  subtitle: NVFP4 · DFly · vision · Engram on disk · 2× GPU
  logo: assets/logo.svg
  short_description: >-
    Tencent's 220B-total / 12B-active multimodal MoE with sparse attention and Engram n-gram
    embedding tables, in a third-party NVFP4 build: text and image input, reasoning, tool
    calling, DFly speculative decoding. Tensor-parallel across two RTX PRO 6000 Blackwell
    GPUs with 262,144 tokens per request and 32 requests at once.
    The four Engram tables (59 GiB) are read from the checkpoint files on disk, which leaves
    their GPU memory to the KV cache and needs no large host memory.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    # 96,768 MiB: 489 MiB above the measured peak (96,279 MiB after a 224K-token prompt
    # that followed the benchmark, journal 2026-11-28-first-start-engram-on-disk.md), below
    # the 97,251 MiB an idle GPU has free.
    memory_bytes_per_device: 101468602368
  cpu:
    architecture: amd64
  memory:
    host_bytes: 25769803776

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 96636764160
  # At the peak, after a 224K-token prompt (journal 2026-11-28-first-start-engram-on-disk.md).
  # model_weights is the engine's "Model loading took 51.67 GiB", the DFly draft head
  # included; the Engram tables are not in it, they stay on disk.
  measured_gpu_memory_bytes_per_device:
    model_weights: 55480240046
    cuda_graphs: 1245540516
    runtime_overhead: 7722846126
    kv_cache: 36507222016
  measured_kv_cache_tokens_per_replica: 3277817

api:
  routing_model_id: hy4-flash
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: Tencent
  homepage: https://huggingface.co/tencent/Hy4-flash
  released_at: '2026-11-17'
  parameter_count: 220000000000
  active_parameter_count: 12000000000
  weights_disk_size_bytes: 164688108292
  license:
    expression: LicenseRef-Tencent-Hy-1.0
    name: Tencent Hy License 1.0
    url: https://huggingface.co/tencent/Hy4-flash/blob/main/LICENSE
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4
  speculative_decoding: dfly
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: huggingface
      repository: atakans/Hy4-flash-NVFP4
      revision: 5d9383f300a55d13933ce3038658453dd3b27015
      files:
      - LICENSE
      - chat_template.jinja
      - config.json
      - engram-fp8.json
      - generation_config.json
      - hf_quant_config.json
      - model-00001-of-00014.safetensors
      - model-00002-of-00014.safetensors
      - model-00003-of-00014.safetensors
      - model-00004-of-00014.safetensors
      - model-00005-of-00014.safetensors
      - model-00006-of-00014.safetensors
      - model-00007-of-00014.safetensors
      - model-00008-of-00014.safetensors
      - model-00009-of-00014.safetensors
      - model-00010-of-00014.safetensors
      - model-00011-of-00014.safetensors
      - model-00012-of-00014.safetensors
      - model-00013-of-00014.safetensors
      - model-00014-of-00014.safetensors
      - model.safetensors.index.json
      - processor_config.json
      - tokenizer.json
      - tokenizer_config.json
