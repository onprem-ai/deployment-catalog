# Upstream SGLang, pinned by digest (lmsysorg/sglang, built 2026-09-10, CUDA 13.0.3;
# the image behind the lcz.me 4x RTX PRO 6000 benchmark). The tag is descriptive only:
# the node pulls by the digest.
# container-files/: the disk-Engram adapter, reviewed copies of
#   soloptimizer/deepseek-v4.1-flash-4x-rtx-pro-6000@34047e42 (sybil-solutions PR #3):
#     adapter/engram_backend.py, adapter/sitecustomize.py, adapter/row_store.cpp
#   ryder777777/deepseek-v4.1-flash-4x-rtx-pro-6000@1b1353f9 (sybil-solutions PR #4):
#     runtime/flash_mla_sm120.py (SM120 sparse-prefill mask fix for prompts > 64 tokens),
#     plus DSV41_SM120_PREFILL_BACKEND=dec64 (prefill through the FlashInfer decode
#     kernel in 64-token slices; see the journal), and debug tools left switched off:
#     DSV41_SM120_PREFILL_CHECK, DSV41_SM120_PREFILL_MODE_FILE, selftest.py, tcp_forward.py
# The adapter reads Engram rows with pread / native AIO on O_DIRECT (allowed by Docker's
# default seccomp profile), keeps a bounded mmap RAM cache of DSV41_CACHE_GIB in total,
# and never allocates the full tables. No io_uring, no mlock.
services:
  inference:
    image: lmsysorg/sglang:dig-c4ca651192e57e91@sha256:c4ca651192e57e91989b5176c3665148131b9a171e53861dee87f5e57cef25b5
    entrypoint: [/bin/bash, -c]
    command:
      - |-
        set -euo pipefail
        A=/opt/dsv41/adapter
        mkdir -p "$$A"
        cp /opt/dsv41/src/engram_backend.py /opt/dsv41/src/sitecustomize.py /opt/dsv41/src/row_store.cpp "$$A/"
        T=/sgl-workspace/sglang/python/sglang/kernels/ops/attention/flash_mla_sm120.py
        test -f "$$T" || { echo "missing $$T: the image layout differs from the adapter's"; exit 1; }
        cp /opt/dsv41/src/flash_mla_sm120.py "$$T"
        python3 /opt/dsv41/src/make_view.py /models/model /opt/model-view
        g++ -O2 -std=c++17 -shared -fPIC -pthread "$$A/row_store.cpp" -o "$$A/librow_store.so"
        python3 -m sglang.launch_server \
          --model-path /opt/model-view \
          --served-model-name deepseek-v4.1-flash \
          --trust-remote-code --load-format safetensors \
          --model-loader-extra-config '{"enable_multithread_load": false}' \
          --tp 4 --ep-size 4 \
          --attention-backend dsv4 --moe-runner-backend flashinfer_mxfp4 \
          --mem-fraction-static 0.85 --chunked-prefill-size 2048 \
          --context-length 131072 --max-running-requests 8 --cuda-graph-max-bs-decode 8 \
          --speculative-algorithm DSPARK --speculative-dspark-block-size 5 \
          --enable-decoder-swa-bounded-replay \
          --tool-call-parser deepseekv41 --reasoning-parser deepseek-v41 \
          --host 0.0.0.0 --port 8080 2>&1 | stdbuf -o0 tr '\r' '\n'
    environment:
      PYTHONPATH: "/opt/dsv41/adapter"
      PYTHONUNBUFFERED: "1"
      TQDM_DISABLE: "1"
      DSV41_SM120_PREFILL_BACKEND: "dec64"
      DSV41_SOURCE: "/models/model"
      OFFLOAD_MODE: "nvme"
      DSV41_CACHE_GIB: "8"
      DSV41_ENGRAM_IO_DEPTH: "64"
      NCCL_IB_DISABLE: "1"
      NCCL_P2P_LEVEL: "SYS"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - model:/models/model:ro
      - ./container-files:/opt/dsv41/src:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '4'
          memory: 16G
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
        limits:
          cpus: '24'
          memory: 40G

volumes:
  model:
    x-ai-deploy:
      weights: main
