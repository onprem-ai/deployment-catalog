services:
  inference:
    # The SGLang image inclusionAI names for the source model LingSante-3.1-flash (FP8),
    # pinned by its multi-arch digest. The MXFP4 card asks for "a SGLang build with
    # bailing_hybrid, mixed FP8/MXFP4 checkpoint loading, Humming MoE, and ling3 parser
    # support" (Humming 0.1.12) and names no image: that this one has the Humming backend is
    # UNVERIFIED. NOT PULLED OR RUN by onprem-ai.
    image: lmsysorg/sglang:dev-ling-3.1-flash@sha256:001bd5c3d594767a4bb2bfc44dc7a3cf548cc190c17dfdf3d88de3a814f1c10f
    # NOBODY HAS RUN THIS COMMAND ON THESE GPUS. It is the MXFP4 card's (4 x NVIDIA H20-3e,
    # 141 GB each, TP4 / EP4 / DP1) with these changes for 96 GB cards:
    # - --mem-fraction-static 0.88 instead of 0.80. The weights are 291.7 GiB, 72.9 GiB per
    #   GPU if they divide evenly. 0.80 of a 95 GiB card is 76 GiB, which leaves the KV cache
    #   3 GiB; 0.88 is 83.6 GiB, about 10 GiB of KV cache, with 11 GiB outside the pool for
    #   activations and graphs. An estimate: read the pool from the startup log.
    # - --max-running-requests 8 instead of 32, for the small pool.
    # - the model path, the served name and the API port.
    # Unchanged: 262,144-token context, the 8,192-token prefill chunk, the Humming MoE
    # backend with FP8 (E4M3, group 32) expert inputs (W4A8), the triton FP8 GEMM backend,
    # NEXTN speculative decoding, the ling3 parsers.
    # Unknown: whether the Humming and KDA kernels run on RTX PRO 6000 Blackwell (SM120).
    # The publisher's recipes name H20-3e, H200, H100, H800, B200 and GB300 only.
    # --trust-remote-code: configuration_bailing_moe_v3.py and modeling_bailing_moe_v3.py are
    # the publisher's own files in the weights repository.
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/model
      - --served-model-name
      - lingsante-3.1-flash
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --trust-remote-code
      - --enable-cache-report
      - --tp-size
      - "4"
      - --ep-size
      - "4"
      - --dp-size
      - "1"
      - --context-length
      - "262144"
      - --chunked-prefill-size
      - "8192"
      - --prefill-decode-interval
      - "1"
      - --dtype
      - bfloat16
      - --schedule-policy
      - fcfs
      - --mem-fraction-static
      - "0.88"
      - --max-running-requests
      - "8"
      - --fp8-gemm-backend
      - triton
      - --moe-runner-backend
      - humming
      - --moe-a2a-backend
      - none
      - --tool-call-parser
      - ling3
      - --reasoning-parser
      - ling3
      - --speculative-algorithm
      - NEXTN
    environment:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
      SGLANG_HUMMING_INPUT_QUANT_CONFIG: '{"dtype":"float8e4m3","group_size":32}'
      SGLANG_HUMMING_MOE_GEMM_TYPE: "grouped"
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    # 313 GB of weights to read, and SGLang's cookbook reports about five minutes of JIT
    # compilation at the first start of a fresh container.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 3600s
    # Host memory is an estimate: measure it at the first deploy.
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          cpus: "8"
          memory: 24G
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
        limits:
          cpus: "32"
          memory: 48G

volumes:
  model:
    x-ai-deploy:
      weights: main
