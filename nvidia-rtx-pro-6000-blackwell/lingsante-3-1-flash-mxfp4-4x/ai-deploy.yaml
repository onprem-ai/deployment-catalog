$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: LingSante 3.1 Flash
  subtitle: MXFP4 experts · NEXTN · 4× GPU
  logo: assets/logo.png
  short_description: >-
    inclusionAI's medical MoE model for research and evaluation: about 560B total / 25B active
    parameters, medical reasoning, evidence-based research, tool calling, 262,144-token
    context. The publisher's MXFP4 build (routed experts 4-bit by round-to-nearest, the rest
    FP8 and BF16) tensor- and expert-parallel across four RTX PRO 6000 Blackwell GPUs with
    SGLang. Not a medical device.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 4
    # 94 GiB, the whole GPU: 72.9 GiB of weights per GPU leaves little, and nothing is measured.
    memory_bytes_per_device: 100931731456
  cpu:
    architecture: amd64
  memory:
    host_bytes: 51539607552

runtime:
  engine: sglang
  compose: compose.yaml
  # --mem-fraction-static 0.88 of a 95 GiB GPU.
  engine_memory_booking_bytes_per_device: 89764816486

api:
  routing_model_id: lingsante-3.1-flash
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: inclusionAI (Ant Group)
  homepage: https://huggingface.co/inclusionAI/LingSante-3.1-flash-MXFP4
  released_at: '2026-11-22'
  parameter_count: 560000000000
  active_parameter_count: 25000000000
  weights_disk_size_bytes: 313210617180
  license:
    expression: MIT
    name: MIT License
    url: https://huggingface.co/inclusionAI/LingSante-3.1-flash-MXFP4/blob/56229393c30374608ce101f14fa2483b51c2229c/README.md
  mixture_of_experts: true
  format: safetensors
  quantization: mxfp4-experts-fp8-block
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
