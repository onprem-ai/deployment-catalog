$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: DeepSeek V4 Flash Vision
  subtitle: Experimental · DSpark · vision · 1M context
  logo: assets/logo.svg
  short_description: >-
    DeepSeek's first multimodal V4 model: the V4 Flash 0731 language model (284B total / 13B
    active, FP4 experts) with a vision encoder, continued training and a fused DSpark drafter.
    Text and image input, reasoning with effort levels, tool calling. Runs tensor-parallel
    across both RTX PRO 6000 Blackwell GPUs with the full 1M-token context (KV pool 1.6M tokens,
    up to 6 requests at once).
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    # 95 GiB: the measured peak after a 1M-token request is 96,733 MiB (94.47 GiB), over the
    # 94 GiB target; no margin for a driver that reserves more (journal 2026-11-22-1m-context).
    memory_bytes_per_device: 102005473280
  cpu:
    architecture: amd64
  memory:
    host_bytes: 21474836480

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 99857989632
  measured_gpu_memory_bytes_per_device:
    model_weights: 85341000171
    cuda_graphs: 365072220
    runtime_overhead: 4236792301
    kv_cache: 11489037516
  measured_kv_cache_tokens_per_replica: 1617622

api:
  routing_model_id: deepseek-v4-flash-vision
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

