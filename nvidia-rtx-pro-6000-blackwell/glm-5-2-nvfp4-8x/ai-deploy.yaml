$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: GLM 5.2
  subtitle: NVFP4 · 8× GPU
  logo: assets/logo.svg
  short_description: >-
    GLM-5.2 744B MoE for 8x RTX PRO 6000 Blackwell. Luke Alonso NVFP4 routed experts, online MXFP8
    dense projections, FP8 MLA KV cache, B12X kernels, reasoning, tool calling, and MTP speculative
    decoding. MIT licensed.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 8
    memory_bytes_per_device: 97710505984
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: glm-5-2-nvfp4-8x
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

