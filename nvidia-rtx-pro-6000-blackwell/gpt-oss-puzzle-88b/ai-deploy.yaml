$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: GPT OSS Puzzle 88B
  logo: nvidia.svg
  short_description: >-
    NVIDIA's 88B parameter model optimized for reasoning and puzzle-solving tasks. Built on the
    GPT-OSS architecture with enhanced logical reasoning capabilities. Requires custom vLLM build.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 61203283968
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: gpt-oss-puzzle-88b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-03-27'
  parameter_count: 88000000000
  active_parameter_count: 5000000000
  weights_disk_size_bytes: 54760833024
  license:
    expression: LicenseRef-NVIDIA-Open-Model-License
    name: NVIDIA Open Model License
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/
    file: licenses/source-0-LICENSE.md
  mixture_of_experts: true
  format: safetensors
  quantization: fp4
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 131072
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: nvidia--gpt-oss-puzzle-88B--model
      files:
      - chat_template.jinja
      - config.json
      - configuration_gpt_oss_puzzle.py
      - generation_config.json
      - model-00001-of-00011.safetensors
      - model-00002-of-00011.safetensors
      - model-00003-of-00011.safetensors
      - model-00004-of-00011.safetensors
      - model-00005-of-00011.safetensors
      - model-00006-of-00011.safetensors
      - model-00007-of-00011.safetensors
      - model-00008-of-00011.safetensors
      - model-00009-of-00011.safetensors
      - model-00010-of-00011.safetensors
      - model-00011-of-00011.safetensors
      - model.safetensors.index.json
      - modeling_gpt_oss_puzzle.py
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
