$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Inkling 2 Mini
  subtitle: NVFP4 · DSpark · vision · 512K context
  logo: assets/logo.png
  short_description: >-
    Thinking Machines' 26.4B-total / 3.4B-active multimodal looped MoE transformer (the middle
    12 of 24 layers run three times): text and image input, reasoning, tool calling, mixed
    NVFP4 and MXFP8 as shipped, DSpark speculative decoding. One RTX PRO 6000 Blackwell with
    524,288 tokens per request, FP8 KV cache. Runs on a vLLM nightly (0.35.0 is not released);
    measured on one GPU on 2026-11-27.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    # 88 GiB: 84 GiB for the engine and 4 GiB above it. The measured peak is below the
    # engine's 84 GiB (journal 2026-11-27-first-start-tuning-and-benchmark.md).
    memory_bytes_per_device: 94489280512
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 90194313216
  # At the peak of the benchmark (journal 2026-11-27-first-start-tuning-and-benchmark.md).
  measured_gpu_memory_bytes_per_device:
    model_weights: 23482733690
    cuda_graphs: 1288490188
    runtime_overhead: 7063752378
    kv_cache: 59538984960
  measured_kv_cache_tokens_per_replica: 861838

api:
  routing_model_id: inkling-2-mini
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: Thinking Machines Lab
  homepage: https://huggingface.co/thinkingmachines/Inkling-2-Mini
  released_at: '2026-11-20'
  parameter_count: 26400000000
  active_parameter_count: 3400000000
  weights_disk_size_bytes: 20191586893
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4-mxfp8
  speculative_decoding: dspark
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 524288
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: huggingface
      repository: thinkingmachines/Inkling-2-Mini
      revision: c9d028302cd0f035fdf8e7e91f089a4ce94d2195
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - hf_quant_config.json
      - model-00001-of-00001.safetensors
      - model.safetensors.index.json
      - mtp.safetensors
      - processor_config.json
      - special_tokens_map.json
      - tiktoken/tokenizer.model
      - tokenizer.json
      - tokenizer_config.json
