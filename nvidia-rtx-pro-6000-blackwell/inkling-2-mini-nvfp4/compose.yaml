services:
  inference:
    # vLLM's recipe (recipes.vllm.ai/thinkingmachines/Inkling-2-Mini) requires vLLM >= 0.35.0,
    # which is not released: it names vllm/vllm-openai:nightly. This is the nightly of
    # 2026-11-26 (vLLM main at 5aea3057), its multi-arch manifest pinned so the image cannot
    # change upstream. It serves the model on an RTX PRO 6000 Blackwell (journal
    # 2026-11-27-first-start-tuning-and-benchmark.md; the recipe lists GB200, B300, GB300,
    # H100, H200 and DGX Spark). The nightly is built for CUDA 13.2 and needs a driver that
    # supports it (595.112.07 does).
    image: vllm/vllm-openai:nightly-5aea30579ad672c3c35be43112b7a1f7b293a09e@sha256:d24e5fc73f0b859bd76c9d2f6f6fa4da3001afd7637f2610876420f3027ea6c7
    # The command is the recipe's (--tensor-parallel-size 1, --reasoning-parser inkling,
    # DSpark with 7 draft tokens from the speculator bundled in the checkpoint, which is
    # presumably mtp.safetensors: the recipe does not name the file), plus:
    # - the model path, the served name and the API port;
    # - --tool-call-parser inkling with --enable-auto-tool-choice, the recipe's opt-in
    #   tool calling;
    # - --max-model-len 524288. The model's context is 1,048,576 tokens, but the KV pool on
    #   one 96 GB card is 861,838 tokens with the engine's 84 GiB: one full-context request
    #   does not fit (the recipe caps H100 and DGX Spark at 262,144);
    # - --kv-cache-dtype fp8. The recipe leaves the model's 16-bit type; FP8 holds 13 % more
    #   tokens here (760,811 before), decodes 6-9 % faster at 8 and 32 requests, and
    #   answered every check the same, a hidden code at 445,514 prompt tokens included;
    # - --gpu-memory-utilization, which the deploy replaces with the engine booking's share;
    # - --enable-prefix-caching written out.
    # DSpark keeps the recipe's 7 draft tokens: on real coding prompts its tokens 5 to 7
    # are accepted 40 %, 34 % and 27 % of the time. Its draft head takes no image
    # embeddings, so drafts for image requests are made from the text alone.
    # Not set, as in the recipe: --max-num-seqs, --max-num-batched-tokens, image limits.
    entrypoint: [bash, -c]
    command:
      - |-
        set -euo pipefail
        exec vllm serve /models/model \
          --served-model-name inkling-2-mini \
          --host 0.0.0.0 --port 8080 \
          --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.88 \
          --max-model-len 524288 \
          --kv-cache-dtype fp8 \
          --reasoning-parser inkling \
          --tool-call-parser inkling \
          --enable-auto-tool-choice \
          --enable-prefix-caching \
          --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s
    # Host memory is an estimate: measure it at the first deploy.
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "8"
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main
