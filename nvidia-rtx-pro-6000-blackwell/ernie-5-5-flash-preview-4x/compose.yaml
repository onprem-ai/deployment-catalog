services:
  inference:
    # NOT PUSHED, and no digest: this image exists in no registry. Build it from
    # runtime/Dockerfile (vLLM 0.32.0, Baidu's vLLM-ERNIE plugin at ba322a5, the SM120 port
    # "V2" of hyudryu/ERNIE-5.5-Flash-Preview-2-RTXPro6000 at 8c5b856), push it, and pin
    # its digest here before the first deploy. The stock plugin refuses to start on these
    # GPUs: its attention runs on FlashMLA, which has SM90/SM100 kernels only.
    image: onpremai/vllm-ernie55:0.32.0-ba322a5-sm120v2
    # NOBODY HAS RUN THIS COMMAND. It is the two-GPU profile's (the SM120 port's "V2",
    # reported on two GPUs only) with three changes, each an estimate to verify at the
    # first start:
    # - --tensor-parallel-size 4: about 40 GiB of weights on each GPU instead of 80.45 GiB,
    #   which frees about 40 GiB per GPU for the KV cache. The port's kernels, its padded-row
    #   fix and its all-reduce were exercised with two ranks only.
    # - --kv-cache-memory-bytes 34359738368 (32 GiB per GPU). The two-GPU pool holds
    #   1,213,175 tokens in 9.02 GiB per GPU; if the per-GPU cost per token is the same
    #   with four ranks (the caches are latent and compressed, not split by head), 32 GiB
    #   holds about 4.3M tokens: four full-context requests. Read the real pool size from
    #   the startup log. Kept as bytes, not a share: vLLM over-allocates this model's KV
    #   cache from --gpu-memory-utilization and then faults in a long prefill. The
    #   checker's engine.kv-cache-size-fixed warning is expected.
    # - --max-model-len 1048576: the model's full context. The longest prompt the port ran
    #   was 498K tokens (two GPUs, 119 s to first token); a 1M prefill is untested.
    # Unchanged: --max-num-seqs 8, the 1,024-token prefill chunk, FP8 KV cache, DSpark with
    # 7 draft tokens and adaptive verification, --disable-custom-all-reduce with
    # VLLM_ALLREDUCE_USE_FLASHINFER_PCIE_IPC=1 (remove the variable to fall back to NCCL
    # if the PCIe all-reduce does not start with four GPUs).
    # Baidu's own four-GPU command (--data-parallel-size 4 --enable-expert-parallel, MXFP4
    # indexer cache) targets data-centre Blackwell and has not been tried on SM120.
    # --trust-remote-code: the chat tokenizer is the weights repository's own
    # tokenization_ernie.py (tokenizer_config.json auto_map), with encoding_ernie.py and
    # decoding_ernie.py. Read at the pinned revision on 2026-11-26: they import json, re,
    # uuid, tokenizers and transformers only. The checker's model.weights-executable-files
    # warning is expected. --enable-prefix-caching is vLLM 0.32's default, written out.
    entrypoint: [bash, -c]
    command:
      - |-
        set -euo pipefail
        exec vllm serve /models/model \
          --served-model-name ernie-5.5-flash-preview \
          --host 0.0.0.0 --port 8080 \
          --trust-remote-code \
          --tensor-parallel-size 4 \
          --disable-custom-all-reduce \
          --kv-cache-dtype fp8 \
          --kv-cache-memory-bytes 34359738368 \
          --max-model-len 1048576 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 1024 \
          --enable-prefix-caching \
          --reasoning-parser ernie5 \
          --tool-call-parser ernie5 \
          --enable-auto-tool-choice \
          --enable-prompt-tokens-details \
          --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic","enable_adaptive_verification":true}'
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER_PCIE_IPC: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 1800s
    # Host memory is an estimate for four workers: measure it at the first deploy.
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          cpus: "8"
          memory: 24G
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
        limits:
          cpus: "32"
          memory: 48G

volumes:
  model:
    x-ai-deploy:
      weights: main
