services:
  inference:
    # vLLM >=0.25.0 is required by Unsloth; v0.33.0 is the newest release, and
    # holds DFlash2 (vllm-project/vllm#52816). The multi-arch manifest is pinned
    # so the packaged image cannot change upstream.
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    # The image's ENTRYPOINT is `vllm serve`; the entrypoint below replaces it with
    # bash, so the script calls `vllm serve` itself.
    #
    # vLLM leaves prefix caching off by default for hybrid models (Qwen3.8's GDN
    # layers make this one hybrid) while the feature matures, so it is switched on
    # here: a repeated system prompt or conversation is not prefilled again. For a
    # hybrid model vLLM caches whole aligned blocks (about 1600 tokens on this
    # profile), so shorter shared prefixes do not hit.
    entrypoint: [bash, -c]
    command:
      - |-
        set -euo pipefail
        exec vllm serve /models/model \
          --served-model-name qwen3.8-27b \
          --host 0.0.0.0 --port 8080 \
          --gpu-memory-utilization 0.88 \
          --max-num-seqs 128 \
          --max-num-batched-tokens 8192 \
          --kv-cache-dtype fp8 \
          --mamba-ssm-cache-dtype bfloat16 \
          --attention-backend TRITON_ATTN \
          --speculative-config '{"method":"mtp","num_speculative_tokens":2}' \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --chat-template /models/model/chat_template.jinja \
          --enable-prefix-caching
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "8"
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main