services:
  inference:
    # vLLM >=0.25.0 is required by Unsloth. The v0.27.1 multi-arch manifest is
    # pinned so the packaged image cannot change upstream.
    image: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    # That image's ENTRYPOINT is `vllm serve`, so the command is serve's own
    # arguments: the model tag positional, then the flags as list items. A
    # `bash -c` script here would become arguments to `vllm serve` itself --
    # the module invocation belongs to the older vLLM images without an
    # entrypoint.
    command:
      - /models/model
      - --served-model-name
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.88"
      - --max-num-seqs
      - "128"
      - --max-num-batched-tokens
      - "4096"
      - --kv-cache-dtype
      - fp8
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --chat-template
      - /models/model/chat_template.jinja
      # vLLM leaves prefix caching off by default for hybrid models (Qwen3.8's GDN
      # layers make this one hybrid) while the feature matures, so it is switched on
      # here: a repeated system prompt or conversation is not prefilled again. For a
      # hybrid model vLLM caches whole aligned blocks (about 1600 tokens on this
      # profile), so shorter shared prefixes do not hit.
      - --enable-prefix-caching
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "8"
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main