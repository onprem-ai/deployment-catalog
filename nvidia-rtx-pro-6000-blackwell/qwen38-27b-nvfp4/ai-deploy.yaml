$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: Qwen3.8 27B
  subtitle: NVFP4 · MTP
  logo: assets/logo.svg
  short_description: >-
    Unsloth Dynamic V3.0 NVFP4 quantization of Qwen3.8-27B with native multimodal input, reasoning,
    tool use, and MTP speculative decoding.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 90194313216
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: qwen3.8-27b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: Qwen Team, Alibaba Group
  homepage: https://qwen.ai
  released_at: '2026-08-14'
  parameter_count: 27000000000
  architecture: dense-hybrid
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: nvfp4-pack-quantized
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    - video
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: unsloth--Qwen3.8-27B-NVFP4--model
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - model.safetensors
      - model.safetensors.index.json
      - model_mtp.safetensors
      - preprocessor_config.json
      - tokenizer.json
      - tokenizer_config.json
      - video_preprocessor_config.json
      - vocab.json
