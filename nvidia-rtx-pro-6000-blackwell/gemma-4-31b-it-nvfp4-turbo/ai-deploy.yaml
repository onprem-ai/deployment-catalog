$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: Gemma 4 31B IT Turbo
  subtitle: text-only
  logo: assets/logo.svg
  short_description: >-
    LilaRest's optimized text-only repackage of NVIDIA's Gemma 4 31B NVFP4. Strips vision/audio
    encoders and further quantizes attention weights to FP4. 68% smaller, ~2.5x faster than base
    with 1-3% quality loss. Fits on single RTX 6000 Blackwell.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 34359738368
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: gemma-4-31b-it-turbo
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-04-22'
  parameter_count: 31000000000
  weights_disk_size_bytes: 19327352832
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://ai.google.dev/gemma/apache_2.md.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: nvfp4-pack-quantized
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 131072
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: LilaRest--gemma-4-31B-it-NVFP4-turbo--model
