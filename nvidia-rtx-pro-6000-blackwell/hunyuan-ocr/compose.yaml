services:
  inference:
    image: vllm/vllm-openai:dig-a230095847e93bd4@sha256:a230095847e93bd4df9888b33dab956fa9504537b828a23657d2b26fed57b5c9
    entrypoint: [bash, -c]
    command:
      - |-
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name hunyuan-ocr \
          --host 0.0.0.0 --port 8080 \
          --trust-remote-code \
          --gpu-memory-utilization 0.08 \
          --max-num-seqs 128 \
          --max-num-batched-tokens 4096 \
          --max-model-len 32768 \
          --tensor-parallel-size 1 \
          --no-enable-prefix-caching \
          --mm-processor-cache-gb 0

    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 8G

volumes:
  model:
    x-ai-deploy:
      weights: main