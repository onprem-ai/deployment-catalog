$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: Apertus v1.5 8B
  subtitle: FP8
  logo: assets/logo.svg
  short_description: >-
    FP8_DYNAMIC quantization of the official Apertus v1.5 8B on all linear projections. 10.7 GiB
    (~1.7x compression). Baseline: onprem-ai/Apertus-v1.5-8B-FP8 release
    (Apertus1p5ForConditionalGeneration). vLLM only.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 30064771072
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: apertus-v1.5-8b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-08-03'
  parameter_count: 8300000000
  weights_disk_size_bytes: 12884901888
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://huggingface.co/onprem-ai/Apertus-v1.5-8B-FP8/raw/e8bd629743737a47b191655cd538cdd7a5a707f1/LICENSE.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: fp8
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: onprem-ai--Apertus-v1.5-8B-FP8--model-apertus-model
