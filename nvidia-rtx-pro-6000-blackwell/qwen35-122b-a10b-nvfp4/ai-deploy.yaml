$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: Qwen3.5 122B-A10B
  subtitle: NVFP4
  logo: qwen.svg
  short_description: >-
    Alibaba's hybrid architecture model with NVIDIA FP4 quantization. 122B total params with ~10B
    activated (MoE). Vision-language multimodal support. Thinking mode with <think> blocks.
    Optimized for NVIDIA Blackwell GPUs.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    memory_bytes_per_device: 91268055040
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml

api:
  routing_model_id: qwen35-122b-a10b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-02-25'
  parameter_count: 122000000000
  active_parameter_count: 10000000000
  weights_disk_size_bytes: 77309411328
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://huggingface.co/Qwen/Qwen3.5-122B-A10B/resolve/dc4d348443bc740c68e2d77492492c11606384d5/LICENSE
    file: licenses/source-0-LICENSE.txt
  mixture_of_experts: true
  format: safetensors
  quantization: nvfp4
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: onprem-ai
      repository: Sehyo--Qwen3.5-122B-A10B-NVFP4--model
      files:
      - LICENSE
      - config.json
      - generation_config.json
      - model-00001-of-00002.safetensors
      - model-00002-of-00002.safetensors
      - model.safetensors.index.json
      - preprocessor_config.json
      - processor_config.json
      - tokenizer.json
      - tokenizer_config.json
      - video_preprocessor_config.json
      - vocab.json
