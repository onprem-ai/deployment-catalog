$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Qwen3.8 Flash Next
  subtitle: NVFP4 · MTP · 2× GPU
  logo: assets/logo.svg
  short_description: >-
    Qwen's 176B-total, 6B-active multimodal MoE preview of the Qwen4 architecture. Uses NVFP4 routed
    experts, an FP8 PLE n-gram table, Qwen Sparse Attention, and in-checkpoint MTP speculative
    decoding across two RTX PRO 6000 Blackwell GPUs without host-RAM weight offload.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    memory_bytes_per_device: 100931731456
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: sglang
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 94489280512
  measured_gpu_memory_bytes_per_device:
    model_weights: 69814693396
    drafters: 128849018
    cuda_graphs: 2587717795
    runtime_overhead: 19225263475
    kv_cache: 7881264988
  measured_kv_cache_tokens_per_replica: 592576

api:
  routing_model_id: qwen3.8-flash-next
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

