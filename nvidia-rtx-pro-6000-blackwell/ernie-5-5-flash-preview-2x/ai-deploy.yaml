$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: ERNIE 5.5 Flash Preview
  subtitle: FP4 experts · DSpark · 2× GPU
  logo: assets/logo.svg
  short_description: >-
    Baidu's 280B-total / 14B-active text MoE for agentic coding and knowledge work: blockwise
    FP8 with MXFP4 routed experts as shipped, DSpark speculative decoding, reasoning with
    effort levels, tool calling. Tensor-parallel across two RTX PRO 6000 Blackwell GPUs with
    300,000 tokens per request (KV pool 1.2M tokens, 12 requests at once), on a community SM120
    port of Baidu's vLLM plugin.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    # 97,152 MiB (94.875 GiB), the whole GPU: the measured peak is 97,027 MiB after long
    # prompts (journal 2026-11-27-tuning-and-benchmark.md), and an idle RTX PRO 6000
    # Blackwell has 97,251 MiB free, so a 95 GiB booking makes the deploy warn "Not enough
    # VRAM" on an empty GPU. No room for a driver that reserves more.
    memory_bytes_per_device: 101871255552
  cpu:
    architecture: amd64
  memory:
    host_bytes: 21474836480

runtime:
  engine: vllm
  compose: compose.yaml
  # At the peak, after long prompts (journal 2026-11-27-tuning-and-benchmark.md).
  measured_gpu_memory_bytes_per_device:
    model_weights: 85534273699
    cuda_graphs: 2308544921
    runtime_overhead: 4214821780
    kv_cache: 9680446000
  measured_kv_cache_tokens_per_replica: 1213175

api:
  routing_model_id: ernie-5.5-flash-preview
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

