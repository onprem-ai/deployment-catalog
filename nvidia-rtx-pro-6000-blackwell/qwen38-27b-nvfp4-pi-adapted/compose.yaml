services:
  inference:
    # The qwen38-27b-nvfp4 profile's image, unchanged.
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    # The command is the qwen38-27b-nvfp4 profile's with the LoRA adapter of
    # harness-hub/Qwen3.8-27B-pi-adapted loaded on top. vLLM applies the LoRA to this NVFP4
    # (compressed-tensors) base: the adapter loads and answers differently from the base
    # (journal 2026-11-27-first-start-tuning-and-benchmark.md). The adapter's card serves it
    # on Qwen/Qwen3.8-27B in BF16 and says quantized bases drift from the trained behaviour;
    # how much of its benchmark gain survives here is not measured.
    #
    # Kept from the template: the image, --gpu-memory-utilization (replaced at deploy by
    # the engine booking's share), --max-num-seqs 128, --max-num-batched-tokens 8192, FP8
    # KV cache, --mamba-ssm-cache-dtype, --attention-backend TRITON_ATTN, --reasoning-parser
    # qwen3, prefix caching, the native 262,144-token context (the adapter's evaluations
    # ran with 131,072).
    #
    # From the adapter's card, the configuration of its evaluations:
    # - --enable-lora --max-lora-rank 32 --lora-modules: the adapter is the model
    #   qwen3.8-27b-pi; the base model alone answers as qwen3.8-27b-pi-base.
    # - --default-chat-template-kwargs '{"enable_thinking": false}': thinking off is what
    #   the adapter was trained for. A request can still switch it on (about 4 times the
    #   tokens for at most a few more solved tasks, by the card).
    # - --chat-template: the adapter repository's template, the one it was trained with.
    #   The template profile's is Unsloth's, which merges system messages differently.
    # - --tool-call-parser qwen3_xml instead of the template's qwen3_coder.
    # - --language-model-only: the evaluations are text only and the vision tower is not
    #   served, so this profile takes no images or video.
    #
    # MTP speculative decoding with 4 draft tokens (the template has 2; the adapter's card
    # has none). The MTP head drafts for the base model, and vLLM runs it together with the
    # LoRA: on real coding prompts 93 %, 84 %, 75 % and 67 % of its four tokens are
    # accepted. One request decodes 155 tokens per second instead of 62, 32 requests 2,754
    # instead of 1,467.
    # Not passed: the adapter card's --mamba-cache-mode align. It is deprecated in vLLM 0.33
    # ("It has no effect: Mamba prefix caching follows --enable-prefix-caching").
    entrypoint: [bash, -c]
    command:
      - |-
        set -euo pipefail
        exec vllm serve /models/model \
          --served-model-name qwen3.8-27b-pi-base \
          --host 0.0.0.0 --port 8080 \
          --gpu-memory-utilization 0.88 \
          --max-num-seqs 128 \
          --max-num-batched-tokens 8192 \
          --kv-cache-dtype fp8 \
          --mamba-ssm-cache-dtype bfloat16 \
          --attention-backend TRITON_ATTN \
          --speculative-config '{"method":"mtp","num_speculative_tokens":4}' \
          --language-model-only \
          --enable-lora \
          --max-loras 1 \
          --max-lora-rank 32 \
          --lora-modules qwen3.8-27b-pi=/models/adapter \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_xml \
          --chat-template /models/adapter/chat_template.jinja \
          --default-chat-template-kwargs '{"enable_thinking": false}' \
          --enable-prefix-caching
    volumes:
      - model:/models/model:ro
      - adapter:/models/adapter:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        # 24G: with the template's 16G the container held 15.6 GiB after 250K-token prompts
        # (journal 2026-11-27-first-start-tuning-and-benchmark.md).
        limits:
          cpus: "8"
          memory: 24G

volumes:
  model:
    x-ai-deploy:
      weights: main
  adapter:
    x-ai-deploy:
      weights: adapter
