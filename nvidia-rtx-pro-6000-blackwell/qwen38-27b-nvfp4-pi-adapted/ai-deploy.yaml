$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Qwen3.8 27B pi-adapted
  subtitle: NVFP4 · pi coding-agent LoRA · MTP · thinking off
  logo: assets/logo.svg
  short_description: >-
    Qwen3.8-27B with harness-hub's LoRA adapter, trained with reinforcement learning to drive
    the pi coding agent on software-engineering and terminal tasks: with thinking off it
    reaches most of the base model's maximum-effort accuracy at a quarter of the tokens. The
    qwen38-27b-nvfp4 profile with the adapter loaded on its NVFP4 weights; text only, tool
    calling, MTP speculative decoding. The adapter was trained on the BF16 weights; measured
    on one GPU on 2026-11-27.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 1
    # 94 GiB, the qwen38-27b-nvfp4 profile's booking; the peak measured with the adapter is
    # in runtime.measured_gpu_memory_bytes_per_device.
    memory_bytes_per_device: 100931731456
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 94489280512
  # At the peak of the benchmark (journal 2026-11-27-first-start-tuning-and-benchmark.md).
  measured_gpu_memory_bytes_per_device:
    model_weights: 23310934999
    cuda_graphs: 1052266987
    runtime_overhead: 10618593609
    kv_cache: 64682207477
  measured_kv_cache_tokens_per_replica: 1759036

api:
  # The LoRA module's name: a request for this model runs with the adapter. The base
  # model without it is served as qwen3.8-27b-pi-base and is not routed.
  routing_model_id: qwen3.8-27b-pi
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: harness-hub (adapter); Qwen Team, Alibaba Group (base model)
  homepage: https://huggingface.co/harness-hub/Qwen3.8-27B-pi-adapted
  released_at: '2026-11-16'
  parameter_count: 27000000000
  architecture: dense-hybrid
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: nvfp4-pack-quantized
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
    # The base model: the qwen38-27b-nvfp4 profile's weights, unchanged
    # (unsloth/Qwen3.8-27B-NVFP4 at 16b6615af3548b88e2d8e382457bc705b00479cf).
    main:
      provider: onprem-ai
      repository: unsloth--Qwen3.8-27B-NVFP4--model
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - model.safetensors
      - model.safetensors.index.json
      - model_mtp.safetensors
      - preprocessor_config.json
      - tokenizer.json
      - tokenizer_config.json
      - video_preprocessor_config.json
      - vocab.json
    # The LoRA adapter (rank 32, 638 MB) and the chat template it was trained with.
    adapter:
      provider: huggingface
      repository: harness-hub/Qwen3.8-27B-pi-adapted
      revision: 41396a9f14d9c1a1bf5bee4fb89e9dddadaeae7e
      files:
      - adapter_config.json
      - adapter_model.safetensors
      - chat_template.jinja
      - tokenizer.json
      - tokenizer_config.json
