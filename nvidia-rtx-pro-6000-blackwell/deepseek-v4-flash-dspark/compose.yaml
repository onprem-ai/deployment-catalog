services:
  inference:
    image: onpremai/vllm-dsv4-dspark:2026-07-20-prebaked@sha256:034c7ab6f2b045cb6f80c61b9816fcb8b405d0fa26b7fc627cd8b1d39d9fc4a9
    entrypoint: [bash, -c]
    command:
      - |-
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name deepseek-v4-flash \
          --host 0.0.0.0 --port 8080 \
          --trust-remote-code \
          --kv-cache-dtype fp8 \
          --block-size 256 \
          --tensor-parallel-size 2 \
          --disable-custom-all-reduce \
          --gpu-memory-utilization 0.98 \
          --max-num-seqs 128 \
          --max-model-len 262144 --max-num-seqs 8 --kv-cache-dtype fp8 \
          --max-num-batched-tokens 4096 \
          --max-cudagraph-capture-size 48 \
          --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"cudagraph_capture_sizes":[5,6,10,12,15,18,20,24,25,30,35,36,40,42,48]}' \
          --async-scheduling \
          --no-scheduler-reserve-full-isl \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-flashinfer-autotune \
          --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
          --kernel-config.moe_backend flashinfer_cutlass \
          --tokenizer-mode deepseek_v4 \
          --tool-call-parser deepseek_v4 \
          --reasoning-parser deepseek_v4 \
          --enable-auto-tool-choice

    environment:
      CUDA_CACHE_PATH: "/cache/jit/nv-compute"
      FLASHINFER_WORKSPACE_BASE: "/cache/flashinfer"
      NCCL_IB_DISABLE: "1"
      NCCL_P2P_LEVEL: "SYS"
      NCCL_PROTO: "LL,LL128,Simple"
      NVIDIA_DISABLE_REQUIRE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TILELANG_CACHE_DIR: "/cache/tilelang"
      TORCHINDUCTOR_CACHE_DIR: "/cache/torchinductor"
      TORCH_EXTENSIONS_DIR: "/cache/torch_extensions"
      TRITON_CACHE_DIR: "/cache/triton"
      TVM_CACHE_DIR: "/cache/tvm"
      VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      VLLM_CACHE_ROOT: "/cache/vllm"
      VLLM_DISABLED_KERNELS: "CutlassFp8BlockScaledMMKernel"
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
      VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS: "trtllm::fused_moe::gemm1,trtllm::fused_moe::gemm2"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      XDG_CACHE_HOME: "/cache"
    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 20G

volumes:
  model:
    x-ai-deploy:
      weights: main