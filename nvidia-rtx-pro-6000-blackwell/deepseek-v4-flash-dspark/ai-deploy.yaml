$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1/ai-deploy.schema.json

display:
  name: DeepSeek V4 Flash
  subtitle: DSpark
  logo: deepseek.svg
  short_description: >-
    DeepSeek's fast MoE flagship with DSpark speculative decoding. 284B total / 13B active params,
    FP8, reasoning and tool calling. Runs tensor-parallel across both RTX 6000 Blackwell GPUs.
  maturity: deprecated
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-rtx-pro-6000-blackwell
    count: 2
    memory_bytes_per_device: 100931731456
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
