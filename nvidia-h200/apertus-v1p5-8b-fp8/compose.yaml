services:
  inference:
    image: ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-amd64@sha256:d85533f251c8272218ae2e519510836376e5a335b44f2204f193018e37753bc6
    # Prefix caching stated, not left to the engine default: a repeated system prompt or
    # conversation is not prefilled again. On for this model on every vLLM version;
    # stated so a newer engine cannot change it unseen.
    entrypoint: [bash, -c]
    command:
      - |-
        python3 -m vllm.entrypoints.openai.api_server \
          --model /models/model \
          --served-model-name apertus-v1.5-8b \
          --host 0.0.0.0 --port 8080 \
          --enable-prefix-caching \
          --dtype auto \
          --limit-mm-per-prompt '{"image": 2, "audio": 0}' \
          --gpu-memory-utilization 0.1717 \
          --max-num-seqs 256 \
          --max-num-batched-tokens 16384 \
          --max-model-len 131072 --kv-cache-dtype fp8_e4m3 \
          --tool-call-parser apertus --enable-auto-tool-choice \
          --reasoning-parser apertus \
          --chat-template /models/model/chat_template.jinja

    volumes:
      - model:/models/model:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "4"
          memory: 16G

volumes:
  model:
    x-ai-deploy:
      weights: main