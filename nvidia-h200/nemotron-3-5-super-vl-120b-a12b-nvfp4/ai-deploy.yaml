$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Nemotron 3.5 Super VL 120B
  subtitle: NVFP4 · MTP
  logo: assets/logo.svg
  short_description: >-
    NVIDIA's vision-language Mamba-2/Transformer hybrid MoE, 120B total and 12B active parameters,
    with NVFP4 weights. Text, image and video input, reasoning, tool use and native MTP speculative
    decoding, up to 1M tokens of context on one H200. Hopper runs the FP4 weights as W4A16.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 140660178944
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 126701535232
  measured_gpu_memory_bytes_per_device:
    model_weights: 76622216561
    cuda_graphs: 1288490189
    runtime_overhead: 14284205588
    kv_cache: 40984725422
  measured_kv_cache_tokens_per_replica: 8053536

api:
  routing_model_id: nemotron-3.5-super-vl
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
    # The model thinks by default, and a short token cap ends inside its reasoning;
    # thinking off and room for a few words make the check see a real answer.
    smoke_test:
      request:
        headers: {}
        body:
          messages:
          - role: user
            content: say hello in one word
          max_tokens: 16
          temperature: 0
          stream: false
          chat_template_kwargs:
            enable_thinking: false
      expect:
        status: 200
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

