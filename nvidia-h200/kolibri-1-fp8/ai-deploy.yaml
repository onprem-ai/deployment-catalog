$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Kolibri 1
  subtitle: FP8 · 1M context
  logo: assets/logo.svg
  short_description: >-
    Aleph Alpha's German-English mixture-of-experts reasoning model (78B, 3.5B active) in its
    official FP8 weights on vLLM, with tool calls, four reasoning efforts and 1M context.
    Runs on a single H200 (141 GB).
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 141733920768
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 128849018880
  measured_gpu_memory_bytes_per_device:
    model_weights: 78866336973
    cuda_graphs: 923417969
    runtime_overhead: 8498414878
    kv_cache: 46342697124
  measured_kv_cache_tokens_per_replica: 4015963

api:
  routing_model_id: kolibri-1
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: Aleph Alpha
  homepage: https://aleph-alpha.com/en/blog/kolibri-has-landed-a-sovereign-open-weight-model/
