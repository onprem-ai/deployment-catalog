$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: LightOnOCR 2
  subtitle: 1B · BF16
  logo: assets/logo.svg
  short_description: >-
    LightOn's 1B end-to-end OCR model: a page image in, its text as Markdown out. Tuned for
    batch throughput on one H200 (about 4 pages/s on the full olmOCR-Bench set).
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 143881404416
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 135291469824

api:
  routing_model_id: lightonocr-2-1b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: LightOn
  homepage: https://huggingface.co/lightonai/LightOnOCR-2-1B
  released_at: '2026-01-16'
  parameter_count: 1000000000
  architecture: dense
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: none
  capabilities:
    input:
    - image
    output:
    - text
    max_context_length: 6144
  weights:
    main:
      provider: huggingface
      repository: lightonai/LightOnOCR-2-1B
      revision: be7c41313c30e940fe5571de59e5fabc779e00c8
      files:
      - added_tokens.json
      - chat_template.jinja
      - config.json
      - generation_config.json
      - model.safetensors
      - processor_config.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
