$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Arete 27B
  subtitle: FP8 · DFlash2
  logo: assets/logo.svg
  short_description: >-
    Nous Research's post-trained Qwen3.8-27B with reinforced western values, quantized to FP8 by
    vLLM at load from the official BF16 weights, with the DFlash2 drafter of Qwen3.8-27B.
    Reasoning, tool calls and 256K context on a single H200 (141 GB).
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 146028888064
  cpu:
    architecture: amd64
  memory:
    host_bytes: 68719476736

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 137438953472
  measured_gpu_memory_bytes_per_device:
    model_weights: 30693456582
    drafters: 3848817896
    cuda_graphs: 1471026299
    runtime_overhead: 10625262551
    kv_cache: 96099893248
  measured_kv_cache_tokens_per_replica: 2041754

api:
  routing_model_id: arete-27b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

