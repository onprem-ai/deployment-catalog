    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: fp8
  speculative_decoding: dflash
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
