$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Qwen3.8 27B
  subtitle: FP8 · MTP
  logo: assets/logo.svg
  short_description: >-
    Alibaba's dense 27B hybrid-attention model in Qwen's official block-scaled FP8 checkpoint on vLLM,
    with its built-in MTP head for speculative decoding. Text, image and video input, reasoning, tool
    calls and 256K context on a single H200 (141 GB).
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 146028888064
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 137438953472
  measured_gpu_memory_bytes_per_device:
    model_weights: 30682785508
    drafters: 477202224
    cuda_graphs: 2126008812
    runtime_overhead: 8457226813
    kv_cache: 99793565123
  measured_kv_cache_tokens_per_replica: 2579669

api:
  routing_model_id: qwen3.8-27b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: Alibaba Qwen
  homepage: https://qwen.ai
  released_at: '2026-08-14'
  parameter_count: 27000000000
  architecture: dense
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://huggingface.co/Qwen/Qwen3.8-27B-FP8/resolve/c3a462cc3d38cf351f3b26cbd763469eeb74ef81/LICENSE
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: fp8
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 262144
    reasoning: true
    tool_use: true
  weights:
