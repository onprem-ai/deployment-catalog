services:
  inference:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    # Settings from NVIDIA Dynamo 1.3.0's validated recipe for one H200 per replica
    # (recipes/gpt-oss-120b/vllm/agg-h200-agentic): OpenAI's MXFP4 weights, the
    # flashinfer_cutlass MoE backend, an FP8 KV cache, 256 sequences, 32,768 batched tokens,
    # async scheduling, FlashInfer autotuning, prefix caching, and NVIDIA's EAGLE3-v3 drafter
    # with 3 draft tokens. The CPU KV-cache offload of that recipe (100 GB of host RAM per GPU)
    # and Dynamo's router are not used. The harmony format needs no reasoning parser: vLLM
    # splits the analysis channel into the reasoning field itself.
    entrypoint: [bash, -c]
    command:
      - |-
        exec vllm serve /models/model \
          --served-model-name gpt-oss-120b \
          --host 0.0.0.0 --port 8080 \
          --tensor-parallel-size 1 \
          --quantization mxfp4 \
          --moe-backend flashinfer_cutlass \
          --kv-cache-dtype fp8 \
          --gpu-memory-utilization 0.8584 \
          --max-model-len 131072 \
          --max-num-seqs 256 \
          --max-num-batched-tokens 32768 \
          --enable-prefix-caching \
          --async-scheduling \
          --enable-flashinfer-autotune \
          --generation-config auto \
          --enable-auto-tool-choice \
          --tool-call-parser openai \
          --speculative-config '{"method":"eagle3","model":"/models/draft","num_speculative_tokens":3}'
    volumes:
      - model:/models/model:ro
      - draft:/models/draft:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 16G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "12"
          memory: 32G

volumes:
  model:
    x-ai-deploy:
      weights: main
  draft:
    x-ai-deploy:
      weights: draft
