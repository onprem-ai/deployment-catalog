$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Gemma 4 E4B IT
  subtitle: FP8 · MTP · vision
  logo: assets/logo.svg
  short_description: >-
    Google DeepMind's efficient Gemma 4 model (4.5B effective parameters) on vLLM, quantized to FP8
    at load from Google's BF16 weights, with Google's MTP drafter. Text and image input, reasoning,
    tool calls, 128K context. Takes a small part of one H200.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 41875931136
  cpu:
    architecture: amd64
  memory:
    host_bytes: 12884901888

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 30064771072
  measured_gpu_memory_bytes_per_device:
    model_weights: 12188931719
    drafters: 191311512
    cuda_graphs: 1513975972
    runtime_overhead: 5060343889
    kv_cache: 12863427052
  measured_kv_cache_tokens_per_replica: 958940

api:
  routing_model_id: gemma-4-e4b-it
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  creator: Google
  homepage: https://ai.google.dev/gemma
  released_at: '2026-04-01'
  parameter_count: 8000000000
  active_parameter_count: 4500000000
  architecture: dense
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://ai.google.dev/gemma/apache_2.md.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: fp8
  speculative_decoding: mtp
  capabilities:
    input:
    - text
    - image
    output:
    - text
    max_context_length: 131072
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: huggingface
      repository: google/gemma-4-E4B-it
      revision: 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - model.safetensors
      - processor_config.json
      - tokenizer.json
      - tokenizer_config.json
    draft:
      provider: huggingface
      repository: google/gemma-4-E4B-it-assistant
      revision: 8d0031ea8c2109e2b1e86bb9368a4539b537f80a
      files:
      - config.json
      - generation_config.json
      - model.safetensors
      - tokenizer.json
      - tokenizer_config.json
