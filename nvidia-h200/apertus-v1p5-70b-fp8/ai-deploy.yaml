$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Apertus v1.5 70B
  subtitle: FP8
  logo: assets/logo.svg
  short_description: >-
    FP8_DYNAMIC quantization of the official Apertus v1.5 70B on all linear projections. 71 GiB
    (1.9x compression, no measurable MMLU loss). Baseline: onprem-ai/Apertus-v1.5-70B-FP8 release
    (Apertus1p5ForConditionalGeneration). vLLM only.
  maturity: experimental
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 140660178944
  cpu:
    architecture: amd64
  memory:
    host_bytes: 17179869184

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 128849018880
  measured_gpu_memory_bytes_per_device:
    model_weights: 75967234048
    runtime_overhead: 15200073810
    kv_cache: 47158740910
  measured_kv_cache_tokens_per_replica: 287840

api:
  routing_model_id: apertus-v1.5-70b
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models
  anthropic:
    container: inference
    port: 8080
    openapi: api/anthropic-messages.yaml
    endpoints:
    - POST /v1/messages

model:
  released_at: '2026-08-01'
  parameter_count: 72800000000
  weights_disk_size_bytes: 78383153152
  license:
    expression: Apache-2.0
    name: Apache License 2.0
    url: https://huggingface.co/onprem-ai/Apertus-v1.5-70B-FP8/raw/70378c8df951c9f932e0a28f72e0148d868b5f6b/LICENSE.txt
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: fp8
  capabilities:
    input:
    - text
    output:
    - text
    max_context_length: 65536
    reasoning: true
    tool_use: true
  weights:
    main:
      provider: huggingface
      repository: onprem-ai/Apertus-v1.5-70B-FP8
      revision: 70378c8df951c9f932e0a28f72e0148d868b5f6b
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - model-apertus-model-00001-of-00003.safetensors
      - model-apertus-model-00002-of-00003.safetensors
      - model-apertus-model-00003-of-00003.safetensors
      - model-vision_tokenizer-model.safetensors
      - model-wavtokenizer-model.safetensors
      - model.safetensors.index.json
      - processor_config.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
