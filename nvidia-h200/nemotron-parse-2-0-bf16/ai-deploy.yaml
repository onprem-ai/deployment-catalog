$schema: https://schemas.onprem.ai/ai-deploy-profiles/v1.1.0/ai-deploy.schema.json

display:
  name: Nemotron Parse 2.0
  subtitle: BF16
  logo: assets/logo.svg
  short_description: >-
    NVIDIA's document parsing model (under 1B parameters): text in reading order, tables,
    charts and handwriting from a page image, with layout classes and boxes. Commercial use
    allowed.
  maturity: stable
  author: onprem-ai

hardware:
  gpu:
    product: nvidia-h200
    count: 1
    memory_bytes_per_device: 34359738368
  cpu:
    architecture: amd64
  memory:
    host_bytes: 34359738368

runtime:
  engine: vllm
  compose: compose.yaml
  engine_memory_booking_bytes_per_device: 25769803776

api:
  routing_model_id: nemotron-parse-2.0
  openai:
    container: inference
    port: 8080
    openapi: https://raw.githubusercontent.com/openai/openai-openapi/38170fdddbb6a1813eae6c6587ee17cf2987185b/openapi.yaml
    endpoints:
    - POST /v1/chat/completions
    - GET /v1/models

model:
  creator: NVIDIA
  homepage: https://huggingface.co/nvidia/NVIDIA-Nemotron-Parse-2.0
  released_at: '2026-08-03'
  parameter_count: 900000000
  architecture: encoder-decoder
  license:
    expression: LicenseRef-OpenMDW-1.1 AND CC-BY-4.0
    name: OpenMDW License Agreement 1.1 (tokenizer CC-BY-4.0)
    url: https://openmdw.ai/license/1-1/
    file: licenses/source-0-LICENSE.txt
  format: safetensors
  quantization: none
  capabilities:
    input:
    - image
    output:
    - text
    max_context_length: 9000
  weights:
    main:
      provider: huggingface
      repository: nvidia/NVIDIA-Nemotron-Parse-2.0
      revision: 4e021c03edc92e715d5d788921a927d0cbb4b4d1
      files:
      - chat_template.jinja
      - config.json
      - generation_config.json
      - hf_nemotron_parse_config.py
      - hf_nemotron_parse_modeling.py
      - hf_nemotron_parse_processor.py
      - logitsprocs/nemotron_parse_vllm_logitprocs.py
      - model.safetensors
      - preprocessor_config.json
      - processor_config.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
